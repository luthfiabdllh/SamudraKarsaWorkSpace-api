  # ─────────────────────────────────────────────────────────────────────────
  # Profil anggota
  # ─────────────────────────────────────────────────────────────────────────

  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: Direktori anggota
      description: |
        Bentuk **direktori** — tanpa `email` dan tanpa `phone`.

        Untuk organisasi seukuran ini, nomor telepon seluruh panitia yang
        terbuka bagi seluruh panitia adalah kebocoran yang nyata, bukan
        teoretis. Yang membutuhkannya — menghubungi anggota divisi —
        mendapatkannya lewat `GET /profiles/admin`, yang dijaga `member:admin`.

        Bentuk lengkap sengaja **bukan** penyaring pada endpoint ini, melainkan
        endpoint tersendiri. Penyaring akan membuat bentuk jawabannya bergantung
        pada peran pemanggil, dan itu jenis perbedaan yang mudah salah dibaca:
        satu cabang `if` yang terbalik, dan seluruh email serta nomor telepon
        terkirim ke semua orang — tanpa error, tanpa gejala, dan hanya ketahuan
        kalau ada yang memeriksa isi jawabannya.

        Diurutkan `fullName` menaik, dan `limit` berlaku atas urutan itu —
        jadi memanggil ulang dengan penyaring berbeda tidak menggeser siapa
        yang masuk ke dalam 100.
      parameters:
        - name: divisionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: clusterId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subunitId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MemberStatus' }
        - name: role
          in: query
          required: false
          description: Cocok kalau peran ini **salah satu** dari peran anggota.
          schema: { $ref: '#/components/schemas/Role' }
        - name: q
          in: query
          required: false
          description: |
            Pencarian `fullName` **atau** `nickname`, tanpa membedakan huruf
            besar-kecil.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          required: false
          description: |
            Bawaannya **100** di sini, bukan 25. Daftar ini dipakai untuk
            memilih orang — pemilih PIC, anggota divisi — dan daftar sepanjang
            itu tidak pernah digulir sampai habis oleh manusia.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Daftar anggota, bentuk direktori.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileDirectory' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'

    post:
      tags: [profiles]
      operationId: createProfile
      summary: Menambah anggota
      description: |
        Policy `member:admin` — hanya `owner` dan `co_owner`.

        **Tanpa email undangan** (keputusan 12 dan 26–28). Baris berstatus
        `invited` berarti "dibuat owner, belum diklaim"; login Google pertama
        kali mengubahnya menjadi `active`. Tidak ada tautan konfirmasi yang
        dikirim ke mana pun, karena sistem ini tidak punya penyedia email sama
        sekali.

        `status` boleh langsung `active` untuk orang yang sudah dipastikan.
        Memaksa dua langkah untuk anggota yang jelas aktif hanya menambah satu
        klik yang selalu dikerjakan tanpa dibaca.

        `roles` dan `status` **ada** di sini dan tidak ada di `ProfileSelfPatch`
        — inilah satu-satunya tempat sah mengubahnya.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCreate' }
      responses:
        '201':
          description: Anggota dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileFull' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateEmail'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /profiles/admin:
    get:
      tags: [profiles]
      operationId: listProfilesAdmin
      summary: Daftar anggota, bentuk lengkap
      description: |
        Policy `member:admin` — hanya `owner` dan `co_owner`.

        Bentuk lengkap: memuat `email`, `phone`, `mustChangePassword`, dan
        seluruh kolom administrasi. Dipisahkan dari `GET /profiles` supaya
        kebocoran data pribadi menuntut **dua** kesalahan, bukan satu — dan
        keduanya dijaga `@Policy` yang berbeda.

        Penyaring dan batasnya sama dengan `GET /profiles`.
      parameters:
        - name: divisionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: clusterId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: subunitId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/MemberStatus' }
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Role' }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Daftar anggota, bentuk lengkap.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProfileFull' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /profiles/me:
    get:
      tags: [profiles]
      operationId: getOwnProfile
      summary: Profil sendiri
      description: |
        Bentuk lengkap, kecuali `passwordHash` dan `googleSub`.

        Ini juga cara klien mengisi `If-Match` pada `PATCH /profiles/me`
        berikutnya (§7.16) — klien yang tidak bisa membaca `version` di sini
        tidak bisa menulis sama sekali.
      responses:
        '200':
          description: Profil pemanggil.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileFull' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

    patch:
      tags: [profiles]
      operationId: updateOwnProfile
      summary: Mengubah profil sendiri
      description: |
        **Kolom privilege tidak bisa ditulis dari sini**, dan itu bukan hasil
        pemeriksaan melainkan bentuk tipe: `ProfileSelfPatch` tidak memuat
        `roles`, `status`, `divisionId`, `clusterId`, `subunitId`, `teamRole`,
        `isKormasit`, `email`, maupun `mustChangePassword`. Medannya memang
        tidak ada, sehingga tidak ada baris kode yang bisa menuliskannya.

        Dua skema terpisah, bukan satu skema dengan penyaring. Di `sksks`
        (§5.1.1) seorang anggota bisa mengubah `division_id` dan `is_kormasit`
        miliknya sendiri: UI-nya sudah memakai whitelist yang benar, tetapi
        RLS-nya tidak — sehingga console browser cukup untuk melewatinya.
        Pelajarannya bukan "periksa lagi di server", melainkan **kolomnya tidak
        boleh ada di skema yang bisa dijangkau**.

        `If-Match` **wajib** di sini, dan itu bukan formalitas: dua perangkat
        milik orang yang sama membuka halaman profil adalah hal yang biasa, dan
        tanpa penguncian, yang menyimpan belakangan menghapus isian yang satunya
        tanpa satu pun pesan (§5.2.12).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSelfPatch' }
      responses:
        '200':
          description: Diubah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileFull' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  /profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'

    get:
      tags: [profiles]
      operationId: getProfile
      summary: Satu anggota, bentuk direktori
      description: |
        Bentuk direktori — tanpa `email` dan tanpa `phone`. Bentuk lengkap
        hanya lewat `GET /profiles/admin` atau `GET /profiles/me`.

        `id` yang bukan UUID dijawab `404`, bukan `400`: klien tidak diberi
        cara membedakan "tidak ada" dari "bukan id".
      responses:
        '200':
          description: Anggota ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileDirectory' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

    patch:
      tags: [profiles]
      operationId: updateProfile
      summary: Mengubah anggota
      description: |
        Policy `member:admin` — hanya `owner` dan `co_owner`.

        Memuat seluruh kolom privilege, dan itu memang tujuannya: di sinilah
        tempat sah satu-satunya untuk mengubahnya. Yang menjaga bukan panjang
        daftarnya, melainkan bahwa hanya `member:admin` yang bisa mencapai
        endpoint ini.

        `passwordHash` dan `googleSub` **tidak ada di sini** meski admin pun
        tidak boleh menulisnya: yang pertama hanya lahir dari
        `POST /profiles/{id}/reset-password`, yang kedua hanya dari verifikasi
        Google. Kolom yang tidak boleh ditulis siapa pun tidak perlu muncul di
        DTO mana pun.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: Diubah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileFull' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  /profiles/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/ProfileId'

    post:
      tags: [profiles]
      operationId: resetProfilePassword
      summary: Mengganti password anggota dengan yang sementara
      description: |
        Policy `member:admin`. `200`, bukan `201`: tidak ada resource baru yang
        dibuat, dan `Location` tidak menunjuk apa pun yang bisa diambil kembali.

        Yang dikembalikan adalah **password sementara**, dan ia muncul di
        jawaban ini satu kali saja — tidak disimpan dalam bentuk terbaca di mana
        pun, dan tidak pernah masuk catatan audit. Yang dicatat audit adalah
        **bahwa** passwordnya diganti dan oleh siapa, bukan nilainya: catatan
        audit dibaca lebih banyak orang daripada tabel `profiles`, jadi menaruh
        nilainya di sana memperluas jangkauannya, bukan mempersempitnya.

        Dua efek samping menyertainya, keduanya disengaja:

        - `mustChangePassword` dinyalakan, sehingga seluruh endpoint non-exempt
          ditolak sampai passwordnya diganti (§6.5)
        - **seluruh refresh token anggota itu dicabut.** Alasan seseorang
          mengganti password orang lain adalah karena ia menduga akunnya sudah
          dipegang orang lain; kalau sesi yang berjalan dibiarkan hidup, orang
          yang memegangnya tetap masuk — dan password baru hanya menutup pintu
          yang sudah dilewatinya.

        **Tanpa `If-Match`.** Rute ini tidak menyunting isi baris melainkan
        menggantinya dengan nilai baru. "Perubahan yang hilang" tidak punya arti
        di sini: dua owner yang menekan tombol ini bersamaan menghasilkan satu
        password yang menang, dan yang kalah tidak kehilangan tulisan yang
        dibuatnya — ia hanya perlu membacakan yang menang.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Password diganti.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryPassword' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

# ═══════════════════════════════════════════════════════════════════════════
# Komponen
# ═══════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT, umur 15 menit, berisi `sub`, `roles`, `divisionCodes`,
        dan `jti`.

        `roles` berupa array (keputusan 52), bukan satu nilai — sehingga token
        tidak perlu diterbitkan ulang saat seseorang ditambahkan sebagai kepala
        divisi di divisi lain. Klaimnya adalah **salinan** keadaan saat token
        dibuat; sumber kebenarannya tetap `profiles`, dan umur 15 menit adalah
        batas berapa lama salinan itu boleh basi.

        Dikirim **oleh BFF**, bukan oleh browser (keputusan 31). Token tidak
        pernah menyentuh JavaScript: BFF menyimpannya di cookie `httpOnly` dan
        menukarnya menjadi header ini saat memanggil backend. Konsekuensinya
        untuk kontrak ini: tidak ada satu pun operasi di sini yang boleh
        mengandalkan cookie, dan CORS boleh menolak seluruh origin browser
        (`PRD-SISTEM.md` §5).

  parameters:

    WorkItemId:
      name: id
      in: path
      required: true
      description: Kolom `work_items.id`
      schema: { type: string, format: uuid }

    RequestId:
      name: id
      in: path
      required: true
      description: Kolom `requests.id`
      schema: { type: string, format: uuid }

    PeriodId:
      name: id
      in: path
      required: true
      description: Kolom `periods.id`. Bukan UUID tetap dijawab `404`, bukan `400`.
      schema: { type: string, format: uuid }

    DivisionId:
      name: id
      in: path
      required: true
      description: Kolom `divisions.id`. Bukan UUID tetap dijawab `404`, bukan `400`.
      schema: { type: string, format: uuid }

    ClusterId:
      name: id
      in: path
      required: true
      description: Kolom `clusters.id`. Bukan UUID tetap dijawab `404`, bukan `400`.
      schema: { type: string, format: uuid }

    SubunitId:
      name: id
      in: path
      required: true
      description: Kolom `subunits.id`. Bukan UUID tetap dijawab `404`, bukan `400`.
      schema: { type: string, format: uuid }

    ProfileId:
      name: id
      in: path
      required: true
      description: |
        `profiles.id`.

        Diperhatikan: rute statis `/profiles/me` dan `/profiles/admin`
        didaftarkan **sebelum** `/profiles/{id}` di controller. Kalau urutannya
        terbalik, `GET /profiles/me` akan cocok dengan rute berparameter ini dan
        dijawab `404` "anggota tidak ditemukan" — pesan yang tidak menyebut
        sebabnya sama sekali.
      schema: { type: string, format: uuid }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Penanda posisi, berasal dari `meta.nextCursor` halaman sebelumnya.
        Opaque — klien tidak boleh mengurai atau menyusunnya sendiri.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      required: false
      description: |
        **Selalu ada batas atasnya** — 100. Tanpa batas, satu endpoint cukup
        untuk menarik seluruh tabel, dan itu terjadi lebih cepat daripada yang
        diduga: cukup satu klien yang lupa meneruskan `limit`.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    Sort:
      name: sort
      in: query
      required: false
      description: '`sort=field` naik, `sort=-field` turun, dipisah koma.'
      schema: { type: string, example: '-dueDate,title' }

    Include:
      name: include
      in: query
      required: false
      description: |
        Memuat relasi yang tidak disertakan secara bawaan. Dipakai untuk
        menghindari permintaan tambahan dari frontend, bukan untuk mengizinkan
        pengambilan tanpa batas — daftar nilai yang sah ditentukan per endpoint.
      schema: { type: string, example: 'assignees,division' }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Kunci idempotensi untuk operasi tulis (`PRD-REVAMP.md` §7.10).
        Kunci yang sama dengan body yang sama mengembalikan respons tersimpan,
        bukan membuat baris kedua. Kunci yang sama dengan body yang **berbeda**
        ditolak `409` — itu tanda klien memakai ulang kuncinya untuk hal lain.

        Disimpan 24 jam di `idempotency_keys`. Berguna terutama untuk unggahan
        ulang setelah koneksi putus: percobaan kedua tidak menghasilkan dua
        nomor dokumen.
      schema: { type: string, maxLength: 255, example: '01J8XQ7K3M9W2P' }

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Optimistic locking (`PRD-REVAMP.md` §7.16). Isinya `version` yang
        dibaca klien, sama dengan `ETag` respons terakhir.

        ```
        If-Match: "7"
        ```

        Versi yang tidak cocok dijawab `409`, bukan ditimpa diam-diam. Ini yang
        membuat dua orang mengedit baris yang sama tidak saling menimpa tanpa
        sadar — yang kalah diberi tahu, bukan dikalahkan tanpa suara.

        **Header ini wajib, dan ketiadaannya ditolak `428`** — bukan diabaikan.
        Server **tidak punya** jalur cadangan yang memakai versi bacaannya
        sendiri. Kalau punya, satu klien yang lupa mengirim header akan menulis
        tanpa penguncian sambil mengira sudah memakainya — dan itu keadaan yang
        paling berbahaya: pengaman yang **tampak** terpasang.

        Bentuk yang diterima: `"7"`, `7`, dan `W/"7"`. Header yang **ada** tetapi
        tidak terbaca dijawab `400`, dibedakan dari yang tidak ada supaya
        penguncian yang gagal tidak pernah tersamar sebagai penguncian yang
        tidak diminta.

        Hanya dipasang pada operasi yang **menyunting baris yang sudah ada**.
        `POST` yang membuat baris baru tidak memakainya: tidak ada versi yang
        bisa bertabrakan. `DELETE /organization/*` juga tidak — keempat tabel
        acuan itu memang tidak punya kolom `version`.
      schema: { type: string, example: '"7"' }

  headers:

    ETag:
      description: Versi baris, dikutip sesuai RFC 9110. Kirim kembali apa adanya di `If-Match`.
      schema: { type: string, example: '"7"' }

  responses:

    NotAuthenticated:
      description: Token tidak ada, kedaluwarsa, atau tidak sah.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/not-authenticated
            title: Permintaan ini memerlukan token yang sah
            status: 401
            code: not_authenticated
            instance: /api/v1/work-items
            requestId: 01J8XQ7K3M9W2P

    Forbidden:
      description: |
        Terautentikasi, tetapi perannya tidak boleh membuka endpoint ini.

        **Hanya dipakai untuk penolakan yang tidak menyangkut baris.** Penolakan
        atas sebuah baris selalu `404` — lihat `NotFoundOrHidden`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    NotFoundOrHidden:
      description: |
        Pekerjaan atau permintaan itu tidak ada — **atau** ada tetapi tidak boleh
        dilihat pemanggilnya.

        Keduanya sengaja tidak dibedakan (`PRD-REVAMP.md` §7.3): `403` di sini
        akan memberi tahu penyerang bahwa barisnya ada, dan bagi sebagian tabel
        di sistem ini keberadaan barisnya sendiri sudah merupakan informasi.

        Konsekuensi untuk klien: **jangan membaca `404` sebagai "salah ketik"**.
        Ia juga berarti "bukan urusan Anda", dan menampilkan "tidak ditemukan"
        adalah jawaban yang benar untuk keduanya.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/not-found
            title: Tidak ditemukan
            status: 404
            instance: /api/v1/work-items/9f1c…
            requestId: 01J8XQ7K3M9W2P

    VersionConflict:
      description: |
        `If-Match` tidak cocok dengan `version` yang tersimpan.

        Berbeda dari `TransitionRejected`: yang ini berarti **barisnya sudah
        berubah sejak klien membacanya**, bukan bahwa perpindahan statusnya tidak
        sah. Klien harus memuat ulang barisnya lebih dulu.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    IfMatchRequired:
      description: |
        `If-Match` tidak ada pada operasi yang menuntutnya — `428 Precondition
        Required` (RFC 6585 §3).

        `428`, bukan `400`, dan bedanya berguna: `400` berarti "permintaanmu
        salah", sedangkan `428` berarti "permintaanmu benar, tetapi kamu harus
        mengirimkannya secara bersyarat". Klien yang menerima `400` akan mencari
        kesalahan pada isinya; klien yang menerima `428` tahu persis apa yang
        kurang — versi baris yang dibacanya.

        `code`-nya bergantung modul: `work_item_version_required`,
        `request_version_required`, atau `profile_version_required`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/version-required
            title: Perubahan pekerjaan harus disertai header If-Match.
            status: 428
            code: work_item_version_required
            instance: /api/v1/work-items/9f1c…
            requestId: 01J8XQ7K3M9W2P

    TransitionRejected:
      description: |
        Perpindahan statusnya tidak sah dari keadaan sekarang — atau ada konflik
        sinkronisasi yang belum diselesaikan (keputusan 49), — atau field wajib
        untuk status tujuan belum diisi.

        `409`, bukan `422`: permintaannya benar, keadaannya yang tidak
        memungkinkan. `availableTransitions` pada `GET` berisi daftar yang sah
        untuk aktor itu saat itu.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ValidationFailed:
      description: |
        Isian tidak lolos aturan (`PRD-REVAMP.md` §7.5).

        `422`, bukan `400`. Perbedaannya berguna: `400` berarti ada yang salah
        di kode pemanggil, `422` berarti ada yang salah di isian pengguna — dan
        hanya yang kedua yang memang untuk ditampilkan.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          example:
            type: https://api.invalid/problems/validation-failed
            title: Data yang dikirim tidak valid
            status: 422
            code: validation_failed
            instance: /api/v1/work-items
            requestId: 01J8XQ7K3M9W2P
            errors:
              - field: dueDate
                code: invalid_format
                message: Tanggal tidak dikenali.

    DuplicateCode:
      description: |
        `code` itu sudah dipakai baris lain di tabel yang sama.

        Ditegakkan **indeks unik di database**, bukan pemeriksaan di aplikasi:
        memeriksa lalu menyisipkan adalah dua pernyataan, dan dua permintaan
        yang berbarengan sama-sama lolos pemeriksaan sebelum salah satunya
        menyisipkan. Indeks unik tidak punya celah itu.

        Normalisasi terjadi **sebelum** pencocokan — `code` periode menjadi
        huruf besar, `code` divisi/cluster/subunit menjadi huruf kecil. Jadi
        `KKN-2026` dan `kkn-2026` adalah periode yang sama.

        `409`, bukan `422`: isian pemanggilnya sah, yang gagal hanyalah
        tabrakan dengan baris yang sudah ada — dan itu keadaan, bukan kesalahan
        penulisan.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/duplicate-code
            title: Kode itu sudah dipakai.
            status: 409
            code: duplicate_code
            detail: Kode "SEKBEND" sudah dipakai divisi lain.
            instance: /api/v1/organization/divisions
            requestId: 01J8XQ7K3M9W2P

    DuplicateEmail:
      description: |
        Email itu sudah dipakai profil lain.

        Email adalah **identitas login**, bukan sekadar kolom kontak: satu email
        hanya boleh menunjuk satu orang, karena login Google memakai email
        sebagai kuncinya. Dua baris dengan email yang sama berarti login
        berikutnya bisa masuk ke baris yang mana saja.

        Dibandingkan setelah dinormalisasi (dipangkas dan dihuruf-kecilkan),
        sehingga `Budi@Example.com ` dan `budi@example.com` dianggap sama.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/duplicate-email
            title: Email itu sudah terdaftar.
            status: 409
            code: duplicate_email
            instance: /api/v1/profiles
            requestId: 01J8XQ7K3M9W2P

    StillReferenced:
      description: |
        Baris ini masih dirujuk baris lain, jadi tidak dihapus.

        **Ini penolakan, bukan kegagalan.** Sebagian besar kunci asing di sistem
        ini `on delete set null`, sehingga menghapus paksa akan **berhasil**
        sambil diam-diam mengosongkan rujukannya di mana-mana — tanpa error, dan
        tanpa cara mengetahui nilai sebelumnya. Yang hilang bukan satu baris,
        melainkan kaitan antara banyak baris dan data acuan ini.

        Karena itu penghapusan diperiksa lebih dulu, dan ditolak selagi masih
        ada yang menunjuk. Yang ingin tetap menghapus harus memindahkan
        rujukannya dulu — dan keputusan itu memang pantas diambil sadar.

        Penerapan §5.2.9 di luar jalur keuangan: gagal berisik lebih baik
        daripada berhasil diam-diam dengan akibat yang tidak diminta.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.invalid/problems/still-referenced
            title: Data ini masih dipakai di tempat lain.
            status: 409
            code: still_referenced
            detail: Masih ada 3 anggota yang tergabung di divisi ini.
            instance: /api/v1/organization/divisions/3f1c…/..
            requestId: 01J8XQ7K3M9W2P

    RateLimited:
      description: |
        Melewati batas percobaan. Login 5 per 15 menit; tulis 100/menit; baca
        300/menit; ekspor 5/jam.

        Penghitungnya ada di tabel `rate_limit_counters` di Postgres, bukan di
        memori proses (keputusan 43). Penghitung in-memory akan tampak berfungsi
        saat diuji dan gagal saat dipakai: setiap instans serverless punya
        memorinya sendiri, sehingga batas sebenarnya adalah batas dikali jumlah
        instans.
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ───────────────────────────────────────────────────────────────────────
    # Bentuk umum
    # ───────────────────────────────────────────────────────────────────────

    Problem:
      type: object
      description: |
        RFC 7807 (`PRD-REVAMP.md` §7.5). Seluruh error berbentuk ini — tidak ada
        controller yang menyusun bentuk errornya sendiri, karena bentuk yang
        bersaing berarti frontend harus menebak.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            URI yang menunjuk ke penjelasan jenis masalah ini. Dibentuk dari
            `API_PUBLIC_URL` (keputusan 38), sehingga pindah domain tidak
            menuntut apa pun ditulis ulang.
        title:
          type: string
          description: Ringkasan singkat dan stabil. Boleh ditampilkan ke pengguna.
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: |
            Penjelasan kejadian ini. **Tidak pernah memuat detail internal** —
            nama tabel, potongan SQL, jejak tumpukan. Pada `500`, field ini
            dihilangkan sama sekali.
        instance: { type: string, description: Path request yang gagal. }
        requestId:
          type: string
          description: |
            Untuk menghubungkan keluhan dengan log.

            Berguna **hanya dalam satu jam**: retensi log Vercel adalah 1 jam
            (`PRD-REVAMP.md` §6.2). Di luar rentang itu ia tidak menunjuk apa
            pun, dan itu batas yang harus disadari, bukan ditemukan saat
            dibutuhkan.
        code:
          type: string
          description: |
            Kode mesin yang stabil, untuk dipetakan frontend. Berbeda dari
            `title` yang boleh berubah kata-katanya, `code` tidak pernah berubah
            artinya.
      additionalProperties: true

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            code: { type: string, const: validation_failed }
            errors:
              type: array
              description: Satu entri per field yang gagal.
              items: { $ref: '#/components/schemas/ValidationError' }

    ValidationError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: |
            Jalur field, bertitik untuk yang bersarang (`extraFields.accountNumber`).
            Kosong untuk kegagalan yang tidak terikat field tertentu.
        code:
          type: string
          description: Kode mesin dari pemeriksaannya, mis. `invalid_format`, `too_small`.
        message:
          type: string
          description: Kalimat bahasa Indonesia untuk ditampilkan di sebelah isiannya.

    PageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: |
            Ada kalau `hasMore` true. Opaque — klien mengirimnya kembali apa
            adanya. Menyusunnya sendiri berarti bergantung pada bentuk dalam
            yang boleh berubah kapan saja.
        hasMore: { type: boolean }

    # ───────────────────────────────────────────────────────────────────────
    # Aktor & kosakata
    # ───────────────────────────────────────────────────────────────────────

    Role:
      type: string
      description: |
        Lima peran (keputusan 46), bukan empat. `division_deputy` memegang
        **seluruh** hak `division_head` untuk sekarang; ia berdiri sendiri supaya
        wewenangnya bisa dipisah nanti tanpa migrasi data.

        Label yang dilihat pengguna tetap "Kadiv" dan "Wakil Kadiv" — dictionary
        frontend yang menerjemahkannya, bukan backend.
      enum: [owner, co_owner, division_head, division_deputy, member]

    MemberStatus:
      type: string
      description: |
        Anggota aktif adalah `active`. **`invited` bukan anggota aktif** dan
        tidak punya akses apa pun — di `sksks` ia terhitung aktif karena
        definisinya `status <> 'nonaktif'` (temuan #1).
      enum: [invited, active, inactive]

    WorkStatus:
      type: string
      description: |
        Status pekerjaan, keputusan rapat, dan milestone.

        Delapan nilai. `diarsipkan` yang ada di `sksks` **dibuang**: menyembunyikan
        baris adalah urusan kolom `archivedAt`, bukan urusan status (§14.2).
      enum: [draft, submitted, approved, in_progress, need_review, on_hold, done, rejected]

    WorkItemType:
      type: string
      enum:
        - task
        - request
        - meeting_follow_up
        - program_need
        - division_need
        - milestone
        - evaluation_follow_up
        - subunit_need

    RequestStatus:
      type: string
      description: |
        Sembilan nilai. **`need_clarification` berdiri sendiri** dan tidak pernah
        dipetakan ke `need_review` (temuan #5): yang satu berarti "sudah jadi,
        menunggu dinilai", yang lain berarti "belum bisa jalan".
      enum: [draft, submitted, accepted, in_progress, need_review, need_clarification, on_hold, done, rejected]

    RequestType:
      type: string
      description: Empat belas jenis permintaan. `program_need` muncul di dua enum — di sini dan di `WorkItemType`.
      enum:
        - correspondence
        - budget_plan
        - design
        - video_editing
        - publication
        - documentation
        - goods_procurement
        - goods_loan
        - transportation
        - cargo
        - catering
        - sponsorship
        - program_need
        - general_assistance

    PriorityLevel:
      type: string
      enum: [urgent, high, medium, low]

    Actor:
      type: object
      description: Siapa yang sedang masuk.
      required: [id, email, fullName, roles, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
          description: '`profiles.id` — bukan id di penyedia identitas.'
        email: { type: string, format: email }
        fullName:
          type: [string, 'null']
          description: |
            Nama lengkap, untuk ditampilkan. Selalu ada di respons —
            `profiles.full_name` `not null` — tetapi boleh `null` di kontrak
            karena baris lama dari `sksks` bisa saja kosong.
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: |
            Array, bukan satu nilai (keputusan 52) — satu orang bisa menjadi
            kepala divisi sekaligus anggota di divisi lain.
        divisionCodes:
          type: array
          items: { type: string }
          description: |
            Kode divisi yang **dinaungi** — terisi hanya untuk `division_head`
            dan `division_deputy`. Anggota biasa di divisi Sekretaris &
            Bendahara **tidak** mengisi ini, dan justru itu yang membuat
            pemeriksaan keuangan benar.
        mustChangePassword:
          type: boolean
          description: |
            Kalau true, **seluruh endpoint selain jalur ganti-password ditolak**.
            Penegakannya di backend, bukan di UI: kalau hanya frontend yang
            menahan, satu `curl` dengan token yang sah sudah cukup melewatinya
            (keputusan 10).
        mustChangePasswordExempt:
          type: array
          items: { type: string }
          description: Policy yang tetap boleh dipakai saat penanda itu menyala.

    # ───────────────────────────────────────────────────────────────────────
    # Health
    # ───────────────────────────────────────────────────────────────────────

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
        uptimeSeconds: { type: number }
        version: { type: string }
      description: Liveness. Tidak memuat status database — itu tugas `/health/ready`.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [up, down] }
      description: |
        `503` kalau `database` bernilai `down`. Isinya sengaja sesingkat ini:
        readiness yang menyebutkan detail koneksi memberi tahu penyerang lebih
        banyak daripada yang diberitahukannya kepada operator.

    # ───────────────────────────────────────────────────────────────────────
    # Auth
    # ───────────────────────────────────────────────────────────────────────

    GoogleLoginRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          writeOnly: true
          description: |
            **ID token Google, apa adanya.** Ini yang diterima callback OAuth
            sebagai `id_token`, dan BFF meneruskannya tanpa mengurai apa pun.

            Backend memverifikasi tanda tangannya terhadap kunci publik Google,
            `aud`-nya terhadap `GOOGLE_CLIENT_ID`, `iss`-nya terhadap
            `accounts.google.com`, dan `exp`-nya. Klaim di dalamnya baru dibaca
            **setelah** keempatnya lolos.

            Yang dibaca dari token yang sudah terverifikasi itu:

            - `email_verified` — wajib `true`. Kalau penyedia pernah
              mengembalikan email yang belum terverifikasi, orang bisa
              mengklaim email orang lain, dan itu membatalkan sifat tertutup
              sistem ini.
            - `sub` — pengenal tetap, bukan email. Email bisa berubah; `sub`
              stabil. Setelah login pertama, pencocokan lewat sini.
            - `email` — dinormalisasi (huruf kecil, tanpa spasi) di kedua sisi.

            Bentuk lama `{email, emailVerified, sub}` sebagai JSON biasa **tidak
            didukung**, dan tidak boleh dikembalikan: ketiganya teks yang bisa
            ditulis siapa saja, sehingga siapa pun bisa membuat sesi owner tanpa
            satu kredensial pun.

    PasswordLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, writeOnly: true }
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
          description: Minimal 12 karakter. Diperiksa dengan argon2id.

    AuthResult:
      type: object
      required: [actor, accessToken, refreshToken, expiresIn]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        accessToken:
          type: string
          writeOnly: true
          description: |
            JWT, umur 15 menit, berisi **hanya `sub`**.

            Peran, status keanggotaan, dan `mustChangePassword` sengaja **tidak**
            ada di dalamnya: klaim adalah salinan keadaan saat token dibuat, dan
            salinan itu berlaku sampai tokennya kedaluwarsa. Anggota yang
            dinonaktifkan akan tetap bisa memakai sistem selama sisa umur
            tokennya, peran yang diturunkan tetap berlaku, dan
            `mustChangePassword` yang menyala tidak terlihat. Backend memuat
            aktornya dari database pada setiap permintaan, sehingga ketiganya
            selalu keadaan sekarang.

            Tanpa `jti`: ia hanya berguna kalau ada daftar cabut access token,
            dan yang ada adalah umur 15 menit.
        refreshToken:
          type: string
          writeOnly: true
          description: |
            **Diteruskan BFF ke cookie `httpOnly`; tidak pernah menyentuh
            JavaScript.** Umur 7 hari, dan **dirotasi setiap kali dipakai**.

            Backend mengembalikannya di badan respons — bukan lewat `Set-Cookie`
            — karena yang memegang cookie adalah BFF (keputusan 31), dan
            backend tidak pernah berbicara langsung dengan browser.

            Yang disimpan di database adalah **SHA-256 dari token ini**, bukan
            tokennya. Isi tabel yang bocor tidak langsung memberi penyerang sesi
            siapa pun.
        expiresIn: { type: integer, description: 'Detik. 900 untuk access token.' }

    # ───────────────────────────────────────────────────────────────────────
    # Kolom bersama
    # ───────────────────────────────────────────────────────────────────────

    RowAudit:
      type: object
      description: Jejak baris, ada di hampir setiap resource.
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: [string, 'null'], format: uuid }
        updatedBy: { type: [string, 'null'], format: uuid }
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Disembunyikan dari daftar aktif, **tetapi bukan sampah** — barisnya
            utuh dan biasa dibaca.
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Sampah. Ada di recycle bin dan bisa dipulihkan; hilang dari seluruh
            daftar sampai dipulihkan.

            `deletedAt` dan `archivedAt` **tidak pernah** dipakai bersamaan untuk
            hal yang sama (§14.2). Di `sksks` ada tiga mekanisme penyembunyian
            yang tumpang tindih; yang ketiga — nilai status `diarsipkan` — sudah
            dibuang.

    # ───────────────────────────────────────────────────────────────────────
    # Pekerjaan
    # ───────────────────────────────────────────────────────────────────────

    WorkItem:
      type: object
      required: [id, workNumber, title, type, status, priority, version, availableTransitions]
      properties:
        id: { type: string, format: uuid }
        workNumber:
          type: string
          pattern: '^WI-\d{4}-\d{5}$'
          description: |
            Dihasilkan backend lewat tabel penghitung di dalam transaksi yang sama
            dengan INSERT-nya. **Tanpa celah** — `nextval()` memberi celah setiap
            kali transaksi bergulung balik, sedangkan ini nomor dokumen yang orang
            rujuk (`PRD-BACKEND.md` §8.2).
          examples: ['WI-2026-00001']
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/WorkItemType' }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/WorkStatus' }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        moduleStatus:
          type: [string, 'null']
          description: |
            Status tambahan milik modul pemakainya — teks bebas, bukan enum. Ia
            **tidak** menggantikan `status`, dan tidak pernah dipakai untuk
            menentukan hak akses.
        progressPercentage: { type: integer, minimum: 0, maximum: 100 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        completedAt:
          type: [string, 'null']
          format: date-time
          description: Diisi otomatis saat status menjadi `done`.
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        programId: { type: [string, 'null'], format: uuid }
        periodId: { type: [string, 'null'], format: uuid }
        primaryPicId:
          type: [string, 'null']
          format: uuid
          description: |
            `null` berarti belum ada penanggung jawab — dan pekerjaan seperti itu
            boleh diklaim anggota mana pun lewat `/work-items/{id}/pic`.
        assigneeIds:
          type: array
          items: { type: string, format: uuid }
          description: Penerima tugas selain PIC. Ditambahkan dan dicabut bebas, tetapi hanya di dalam divisi sendiri (keputusan 44).
        blockerReason: { type: [string, 'null'] }
        assistanceNeeded: { type: [string, 'null'] }
        completionSummary:
          type: [string, 'null']
          description: Wajib saat status `done` — dijaga `CHECK` di database juga.
        holdReason:
          type: [string, 'null']
          description: |
            Wajib saat status `on_hold` (keputusan 48). Di `sksks` status ini
            dipasang trigger dengan nilai yang tidak berasal dari isian siapa
            pun; alasan wajib inilah yang membedakan "tertahan karena sesuatu"
            dari "tidak ada yang mengerjakan".
        sourceRequestId:
          type: [string, 'null']
          format: uuid
          description: Permintaan yang melahirkan pekerjaan ini.
        sourceMeetingDecisionId: { type: [string, 'null'], format: uuid }
        syncConflictAt:
          type: [string, 'null']
          format: date-time
          description: |
            Terisi kalau pekerjaan ini dan permintaan asalnya tidak lagi sepakat
            (keputusan 49). Selama terisi, **transisi status ditolak bagi semua
            peran**, termasuk owner.
        syncConflictNote: { type: [string, 'null'] }
        isRecurring: { type: boolean }
        recurrenceRule: { type: [string, 'null'] }
        version:
          type: integer
          minimum: 1
          description: Optimistic locking. Dikirim kembali sebagai `If-Match`.
        availableTransitions:
          type: array
          items: { $ref: '#/components/schemas/WorkStatus' }
          description: |
            Status yang **sah bagi aktor ini** pada baris ini. Frontend tidak
            punya pilihan selain memakainya, dan itu tujuannya: state machine
            tidak bisa lagi hidup hanya di UI (§5.2.2).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }

    WorkItemCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/WorkItemType' }
        description: { type: [string, 'null'] }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        programId: { type: [string, 'null'], format: uuid }
        periodId: { type: [string, 'null'], format: uuid }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        isRecurring: { type: boolean }
        recurrenceRule: { type: [string, 'null'] }
      description: |
        `workNumber`, `status`, `version`, dan `progressPercentage` **tidak
        boleh dikirim**. Nomor dihasilkan backend; status selalu mulai dari
        `draft`; versi dipegang server. Mengirimnya diabaikan, bukan ditolak —
        supaya klien yang menyimpan lalu mengirim ulang objek utuh tidak gagal
        karena field yang memang bukan urusannya.

    WorkItemPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/WorkItemType' }
        description: { type: [string, 'null'] }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        moduleStatus: { type: [string, 'null'] }
        progressPercentage: { type: integer, minimum: 0, maximum: 100 }
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        programId: { type: [string, 'null'], format: uuid }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        blockerReason: { type: [string, 'null'] }
        assistanceNeeded: { type: [string, 'null'] }
        completionSummary: { type: [string, 'null'] }
        holdReason: { type: [string, 'null'] }
      description: |
        `status` **tidak ada di sini** meskipun kolomnya ada di database.
        Memindahkan status lewat `PATCH` berarti satu operasi bermakna
        bercampur dengan operasi biasa, dan aturannya — transisi apa yang sah,
        siapa yang boleh, field apa yang wajib — ikut bercampur juga.

    SetPicRequest:
      type: object
      required: [primaryPicId]
      properties:
        primaryPicId:
          type: [string, 'null']
          format: uuid
          description: |
            `null` mengosongkan PIC. Hanya pemimpin divisi dan owner/co-owner
            yang boleh mengosongkan; anggota hanya boleh **mengisi**.

    WorkItemTransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/WorkStatus' }
        holdReason:
          type: [string, 'null']
          description: Wajib kalau `to` adalah `on_hold` (keputusan 48).
        completionSummary:
          type: [string, 'null']
          description: Wajib kalau `to` adalah `done`.
        blockerReason: { type: [string, 'null'] }
        assistanceNeeded: { type: [string, 'null'] }
        note:
          type: [string, 'null']
          description: Catatan bebas, tersimpan di riwayat status.

    WorkItemPage:
      allOf:
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/WorkItem' }
            meta: { $ref: '#/components/schemas/PageMeta' }

    # ───────────────────────────────────────────────────────────────────────
    # Permintaan
    # ───────────────────────────────────────────────────────────────────────

    Request:
      type: object
      required: [id, requestNumber, title, type, status, priority, version, availableTransitions]
      properties:
        id: { type: string, format: uuid }
        requestNumber:
          type: string
          pattern: '^REQ-\d{4}-\d{5}$'
          examples: ['REQ-2026-00001']
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/RequestType' }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RequestStatus' }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        requesterId: { type: [string, 'null'], format: uuid }
        requesterDivisionId: { type: [string, 'null'], format: uuid }
        targetDivisionId:
          type: string
          format: uuid
          description: |
            Divisi **tujuan**, dan inilah yang menentukan siapa yang boleh
            memindahkan statusnya. Tidak bisa `null`: permintaan tanpa divisi
            tujuan tidak berarti apa-apa.
        assignedPicId: { type: [string, 'null'], format: uuid }
        programId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        periodId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        extraFields:
          type: object
          description: |
            Kolom per jenis permintaan — nomor rekening untuk RAB, ukuran untuk
            desain. Divalidasi skema per jenis, bukan dibiarkan bebas.
          additionalProperties: true
        clarificationNote:
          type: [string, 'null']
          description: Wajib saat status `need_clarification`.
        resultSummary: { type: [string, 'null'] }
        holdReason: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        linkedWorkItemId:
          type: [string, 'null']
          format: uuid
          description: |
            Pekerjaan yang lahir dari permintaan ini. Diisi **saat permintaan
            diajukan**, bukan saat disimpan sebagai draft (temuan #7).
        syncConflictAt:
          type: [string, 'null']
          format: date-time
          description: |
            Terisi saat sinkronisasi dua arah menemukan kedua sisi tidak lagi
            sepakat (keputusan 49). Selama terisi, transisi status ditolak —
            konflik diselesaikan, bukan dilewati.
        syncConflictNote: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        availableTransitions:
          type: array
          items: { $ref: '#/components/schemas/RequestStatus' }
          description: Status yang sah bagi aktor ini pada baris ini.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }

    RequestCreate:
      type: object
      required: [title, type, targetDivisionId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/RequestType' }
        description: { type: [string, 'null'] }
        targetDivisionId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        programId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        periodId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        extraFields: { type: object, additionalProperties: true }

    RequestPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: '#/components/schemas/RequestType' }
        description: { type: [string, 'null'] }
        targetDivisionId: { type: string, format: uuid }
        priority: { $ref: '#/components/schemas/PriorityLevel' }
        programId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        extraFields: { type: object, additionalProperties: true }
        assignedPicId: { type: [string, 'null'], format: uuid }

    RequestTransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/RequestStatus' }
        clarificationNote:
          type: [string, 'null']
          description: Wajib kalau `to` adalah `need_clarification` — dan wajib berisi, bukan string kosong.
        resultSummary:
          type: [string, 'null']
          description: Wajib kalau `to` adalah `done`.
        holdReason:
          type: [string, 'null']
          description: Wajib kalau `to` adalah `on_hold` (keputusan 48).
        note: { type: [string, 'null'] }

    RequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Request' }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ─────────────────────────────────────────────────────────────────────────
    # Organisasi
    # ─────────────────────────────────────────────────────────────────────────

    KknPhase:
      type: string
      description: |
        Tahapan periode. Dipakai untuk menyesuaikan istilah dan menu, bukan
        untuk menentukan izin — periode yang aktif berlaku sama di ketiga fase.
      enum: [pre_kkn, kkn, post_kkn]

    Period:
      type: object
      required: [id, code, name, startsOn, endsOn, phase, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: Selalu huruf besar. `KKN-2026-2027`.
          example: KKN-2026-2027
        name: { type: string, example: KKN 2026/2027 — Desa Sukamaju }
        startsOn:
          type: string
          format: date
          description: Tanggal saja; tidak ada jam.
          example: '2026-12-19'
        endsOn:
          type: string
          format: date
        phase: { $ref: '#/components/schemas/KknPhase' }
        isActive:
          type: boolean
          description: |
            Hanya satu periode boleh `true` sekaligus — dijaga partial unique
            index di database, bukan pemeriksaan di aplikasi. Dua periode aktif
            berarti dua periode yang sama-sama mengaku berlaku, dan setiap
            query yang menyaring "periode yang berlaku" akan memilih salah
            satunya tanpa pola yang bisa ditebak.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PeriodCreate:
      type: object
      required: [code, name, startsOn, endsOn]
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 32
          description: |
            Huruf, angka, dan tanda hubung. **Diubah menjadi huruf besar**,
            bukan ditolak kalau dikirim huruf kecil.
          example: KKN-2026-2027
        name: { type: string, minLength: 2, maxLength: 120 }
        startsOn:
          type: string
          format: date
          description: Bentuk `YYYY-MM-DD`. Harus sebelum `endsOn`.
          example: '2026-12-19'
        endsOn:
          type: string
          format: date
          example: '2027-02-28'
        phase: { $ref: '#/components/schemas/KknPhase' }

    PeriodPatch:
      type: object
      description: Sebagian — medan yang tidak dikirim tidak diubah.
      properties:
        code: { type: string, minLength: 3, maxLength: 32 }
        name: { type: string, minLength: 2, maxLength: 120 }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        phase: { $ref: '#/components/schemas/KknPhase' }

    Division:
      type: object
      required: [id, code, name, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: |
            Selalu huruf kecil, dan **dibandingkan secara harfiah** oleh aturan
            izin (`resource.ts` memegang `'sekbend'`). Lihat `createDivision`.
          example: sekbend
        name: { type: string, maxLength: 120, example: Sekretaris & Bendahara }
        icon:
          type: [string, 'null']
          maxLength: 64
          description: Nama ikon, bukan URL. Dictionary frontend yang memetakannya.
        description: { type: [string, 'null'], maxLength: 2000 }
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          description: Urutan tampil. Boleh sama antar baris; itu bukan kesalahan.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DivisionCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 24
          description: Huruf, angka, dan tanda hubung. **Diubah menjadi huruf kecil.**
        name: { type: string, minLength: 2, maxLength: 120 }
        icon: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999, default: 0 }

    DivisionPatch:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
        icon: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }

    Cluster:
      type: object
      required: [id, code, name, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: c1 }
        name: { type: string, maxLength: 120, example: Cluster 1 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClusterCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999, default: 0 }

    ClusterPatch:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }

    Subunit:
      type: object
      required: [id, code, name, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: dsn-sukamaju }
        name: { type: string, maxLength: 120, example: Subunit Desa Sukamaju }
        villageName:
          type: [string, 'null']
          maxLength: 160
          description: |
            Nama desa, terpisah dari `name`. Dipisahkan karena ia dipakai untuk
            mengelompokkan laporan per desa, sementara `name` adalah label yang
            dibaca manusia dan boleh berbunyi apa saja.
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubunitCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
        villageName: { type: [string, 'null'], maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999, default: 0 }

    SubunitPatch:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 120 }
        villageName: { type: [string, 'null'], maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }

    # ─────────────────────────────────────────────────────────────────────────
    # Profil
    # ─────────────────────────────────────────────────────────────────────────

    ProfileDirectory:
      type: object
      description: |
        Bentuk yang boleh dibaca siapa saja yang sudah masuk. **Tanpa `email`
        dan tanpa `phone`** — lihat `listProfiles`.

        Karena itu ia juga bentuk yang dipakai `GET /profiles/{id}`: satu
        bentuk untuk satu tingkat keterbukaan, bukan bentuk yang berbeda-beda
        menurut siapa yang bertanya.
      required:
        [id, fullName, roles, status, isKormasit, version]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, example: Budi Santoso }
        nickname: { type: [string, 'null'], example: Budi }
        photoUrl: { type: [string, 'null'], format: uri }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: Satu anggota boleh memegang lebih dari satu peran.
        status: { $ref: '#/components/schemas/MemberStatus' }
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        teamRole:
          type: [string, 'null']
          maxLength: 120
          description: Sebutan jabatan bebas, misalnya "Koordinator Acara".
        isKormasit:
          type: boolean
          description: |
            Badge, bukan wewenang. **Tidak dihitung dari peran mana pun** — di
            `sksks` ia kadang disimpulkan dari divisi (temuan #1), sehingga
            seorang kadiv bisa tampil sebagai kormasit tanpa pernah ditetapkan.
        version:
          type: integer
          description: Untuk `If-Match` pada penulisan berikutnya.

    ProfileFull:
      type: object
      description: |
        Bentuk lengkap — `GET /profiles/me` dan `GET /profiles/admin`.

        **`passwordHash` dan `googleSub` tidak pernah ada di sini.** Keduanya
        disebut satu per satu di `fullSelection()`, bukan dibuang setelah
        pengambilan: daftar-buang gagal terbuka (kolom baru ikut terkirim
        sampai seseorang ingat membuangnya), daftar-sebut gagal tertutup.
        Untuk kolom yang isinya hash password, arah kegagalannya tidak boleh
        ditentukan oleh ingatan.
      required:
        [id, email, fullName, roles, status, isKormasit, mustChangePassword, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        nickname: { type: [string, 'null'] }
        photoUrl: { type: [string, 'null'], format: uri }
        phone: { type: [string, 'null'], example: '+62 812-3456-7890' }
        facultyMajor: { type: [string, 'null'], maxLength: 160 }
        batchYear:
          type: [string, 'null']
          description: Empat angka, disimpan sebagai teks — bukan bilangan.
          example: '2023'
        mustChangePassword:
          type: boolean
          description: |
            Selama `true`, seluruh endpoint non-exempt ditolak (§6.5). Menyala
            setelah password diganti admin, dan padam setelah pemiliknya
            menggantinya sendiri.
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        teamRole: { type: [string, 'null'], maxLength: 120 }
        isKormasit: { type: boolean }
        socialLinks:
          type: [object, 'null']
          description: |
            Objek berkunci tetap, bukan `record` bebas — kunci yang tidak
            dikenal ditolak `422`, bukan dibuang diam-diam.
          additionalProperties: false
          properties:
            instagram: { type: [string, 'null'], format: uri, maxLength: 300 }
            linkedin: { type: [string, 'null'], format: uri, maxLength: 300 }
            github: { type: [string, 'null'], format: uri, maxLength: 300 }
            tiktok: { type: [string, 'null'], format: uri, maxLength: 300 }
            youtube: { type: [string, 'null'], format: uri, maxLength: 300 }
            website: { type: [string, 'null'], format: uri, maxLength: 300 }
        skills:
          type: [array, 'null']
          items: { type: string, maxLength: 60 }
          maxItems: 30
        hobbies:
          type: [array, 'null']
          items: { type: string, maxLength: 60 }
          maxItems: 30
        availabilityNote: { type: [string, 'null'], maxLength: 500 }
        emergencyContactName: { type: [string, 'null'], maxLength: 160 }
        emergencyContactPhone: { type: [string, 'null'], maxLength: 32 }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProfileSelfPatch:
      type: object
      description: |
        Yang boleh diubah pemiliknya sendiri — **dan hanya ini**.

        Yang tidak ada di sini, beserta akibatnya kalau ada:

        - `email` — dipakai untuk masuk; mengubahnya dari dalam sesi berarti
          memindahkan akun ke alamat yang mungkin belum diverifikasi pemiliknya
        - `roles`, `status` — menentukan seluruh wewenang; diberikan orang lain
        - `divisionId`, `clusterId`, `subunitId` — menentukan unit kerja. Di
          `sksks` inilah §5.1.1: anggota menunjuk dirinya ke divisi mana pun,
          lalu menjadi Kepala Divisi di sana
        - `teamRole`, `isKormasit` — menulisnya sendiri berarti mengangkat diri
          sendiri
        - `mustChangePassword` — lapisan yang memaksa penggantian password
          sementara; kalau bisa dimatikan sendiri, ia tidak menjaga apa pun

        Semuanya opsional: `PATCH` yang tidak mengirim medan apa pun tetap sah
        dan tidak mengubah apa-apa selain menaikkan `version`.
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        nickname: { type: [string, 'null'], maxLength: 60 }
        photoUrl: { type: [string, 'null'], format: uri, maxLength: 500 }
        phone:
          type: [string, 'null']
          maxLength: 32
          description: |
            Angka, spasi, dan `+ ( ) -`. **Awalan `+62` tidak dipaksakan**: nomor
            darurat bisa saja nomor rumah, dan memaksakannya akan membuat
            formulir menolak isian yang benar.
        facultyMajor: { type: [string, 'null'], maxLength: 160 }
        batchYear:
          type: [string, 'null']
          description: Empat angka, misalnya `2023`.
        socialLinks:
          type: [object, 'null']
          additionalProperties: false
          description: Kunci yang tidak dikenal ditolak `422`, bukan dibuang.
          properties:
            instagram: { type: [string, 'null'], format: uri, maxLength: 300 }
            linkedin: { type: [string, 'null'], format: uri, maxLength: 300 }
            github: { type: [string, 'null'], format: uri, maxLength: 300 }
            tiktok: { type: [string, 'null'], format: uri, maxLength: 300 }
            youtube: { type: [string, 'null'], format: uri, maxLength: 300 }
            website: { type: [string, 'null'], format: uri, maxLength: 300 }
        skills:
          type: [array, 'null']
          items: { type: string, minLength: 1, maxLength: 60 }
          maxItems: 30
        hobbies:
          type: [array, 'null']
          items: { type: string, minLength: 1, maxLength: 60 }
          maxItems: 30
        availabilityNote: { type: [string, 'null'], maxLength: 500 }
        emergencyContactName: { type: [string, 'null'], maxLength: 160 }
        emergencyContactPhone: { type: [string, 'null'], maxLength: 32 }

    ProfileCreate:
      type: object
      description: |
        **Tanpa password.** `invited` berarti "baris dibuat owner, belum
        diklaim", dan login Google pertama kali mengubahnya menjadi `active`
        (keputusan 26–28). Tidak ada email undangan yang dikirim ke mana pun —
        sistem ini tidak punya penyedia email sama sekali, dan jalur email
        itulah yang melahirkan temuan §5.2.7 di `sksks`.
      required: [email, fullName]
      properties:
        email:
          type: string
          format: email
          description: |
            Normalisasi: dipangkas dan dihuruf-kecilkan sebelum disimpan dan
            sebelum dibandingkan. Karena itu `Budi@Example.com ` dan
            `budi@example.com` adalah orang yang sama, dan yang kedua ditolak
            `409`.
        fullName: { type: string, minLength: 2, maxLength: 160 }
        nickname: { type: [string, 'null'], maxLength: 60 }
        phone: { type: [string, 'null'], maxLength: 32 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          minItems: 1
          default: [member]
        status:
          $ref: '#/components/schemas/MemberStatus'
          description: Bawaannya `invited`; boleh langsung `active`.
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        teamRole: { type: [string, 'null'], maxLength: 120 }
        isKormasit: { type: boolean, default: false }

    ProfilePatch:
      type: object
      description: |
        Seluruh kolom privilege — di sinilah tempat sah satu-satunya untuk
        mengubahnya, dan hanya `member:admin` yang bisa mencapainya.

        `passwordHash` dan `googleSub` tidak ada di sini meski admin pun tidak
        boleh menulisnya; kolom yang tidak boleh ditulis siapa pun tidak perlu
        muncul di DTO mana pun.
      properties:
        email: { type: string, format: email }
        fullName: { type: string, minLength: 2, maxLength: 160 }
        nickname: { type: [string, 'null'], maxLength: 60 }
        photoUrl: { type: [string, 'null'], format: uri, maxLength: 500 }
        phone: { type: [string, 'null'], maxLength: 32 }
        facultyMajor: { type: [string, 'null'], maxLength: 160 }
        batchYear: { type: [string, 'null'], maxLength: 12 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          minItems: 1
        status: { $ref: '#/components/schemas/MemberStatus' }
        divisionId: { type: [string, 'null'], format: uuid }
        clusterId: { type: [string, 'null'], format: uuid }
        subunitId: { type: [string, 'null'], format: uuid }
        teamRole: { type: [string, 'null'], maxLength: 120 }
        isKormasit: { type: boolean }
        mustChangePassword:
          type: boolean
          description: |
            Ada di sini dan tidak di `ProfileSelfPatch`: mematikannya sendiri
            adalah cara melewati kewajiban mengganti password sementara.

    TemporaryPassword:
      type: object
      description: |
        Muncul **satu kali saja**, di jawaban ini. Tidak disimpan dalam bentuk
        terbaca di mana pun dan tidak masuk catatan audit — yang dicatat adalah
        bahwa passwordnya diganti dan oleh siapa.

        `mustChangePassword` selalu `true` di sini, karena itu memang tujuan
        seluruh operasinya.
      required: [temporaryPassword, profileId, email, mustChangePassword]
      properties:
        temporaryPassword:
          type: string
          description: Bacakan ke anggotanya lewat kanal yang sudah dikenal, bukan lewat kanal yang sama dengan tautan apa pun.
        profileId: { type: string, format: uuid }
        email: { type: string, format: email }
        mustChangePassword: { type: boolean, enum: [true] }

    ResolveSyncConflictRequest:
      type: object
      description: |
        Menutup konflik sinkronisasi (keputusan 49). Selama `syncConflictAt`
        terisi, transisi status ditolak bagi semua peran — termasuk `owner` —
        dan rute inilah satu-satunya jalan keluar.
      required: [status, note]
      properties:
        status:
          $ref: '#/components/schemas/RequestStatus'
          description: Keadaan yang **diputuskan berlaku**, bukan keadaan yang diharapkan.
        note:
          type: string
          minLength: 3
          maxLength: 2000
          description: |
            Wajib. Konflik yang selesai tanpa catatan alasan akan terulang
            tanpa ada yang tahu mengapa ia pernah ada.
        clarificationNote: { type: [string, 'null'] }
        resultSummary: { type: [string, 'null'] }
        holdReason: { type: [string, 'null'] }
