openapi: 3.1.0

info:
  title: SamudraKarsa Work Space API
  version: 1.1.0-draft
  summary: Kontrak REST — sebagian ditulis sebelum implementasi, sebagian sesudahnya.
  description: |
    Kontrak REST untuk backend `SamudraKarsaWorkSpace-api`.

    ## Soal urutan penulisan — dan satu deviasi yang dicatat terus terang

    `PRD-BACKEND.md` §12 Fase 1 meminta kontrak ini selesai **sebelum** satu
    baris implementasi. Untuk `health`, `auth`, `work-items`, dan `requests`,
    urutan itu dipatuhi. Untuk `organization`, `profiles`, dan
    `POST /requests/{id}/sync-conflict`, **tidak** — ketiganya baru ditulis
    setelah modulnya dibangun di Fase 3.

    Itu deviasi yang diketahui, dan ia dicatat di sini alih-alih ditutupi.

    Yang hilang karenanya nyata: manfaat "memaksa keputusan diambil saat masih
    murah". Bagian-bagian itu adalah **deskripsi atas apa yang sudah ada**,
    bukan perancangan atas apa yang akan ada — menamai field dan memilih status
    code-nya sudah tidak gratis lagi, karena kodenya sudah bergantung padanya.

    Yang **tidak** hilang, dan inilah alasan bagian-bagian itu tetap ditulis:
    berkas ini satu-satunya tempat bentuk API bisa ditinjau sebagai satu
    kesatuan. Tanpa itu, `organization` dan `profiles` hanya bisa diketahui
    dengan membaca controller-nya satu per satu.

    ## Kenapa berkas ini ditulis tangan

    `PRD-BACKEND.md` §11 menetapkan bahwa dokumentasi yang **disajikan** di
    `/api/v1/docs` dihasilkan dari skema Zod, bukan ditulis tangan. Itu tetap
    berlaku. Berkas ini bukan dokumentasi yang disajikan — ia **kontrak yang
    ditulis lebih dulu**, dan justru karena itu ia ditulis tangan.

    `PRD-BACKEND.md` §12 Fase 1 meminta kontrak selesai sebelum implementasi,
    dan tes ditunda (keputusan 7). Konsekuensinya disebut terus terang di sana:
    **kontrak inilah gerbang mutu yang tersisa.** Setelah `@samudrakarsa/shared`
    ada (keputusan 37), Swagger dihidupkan dari skema Zod, dan berkas ini
    berubah peran menjadi acuan yang harus **cocok** dengan keluaran generator —
    bukan sumbernya lagi.

    Urutannya disengaja. Menulis kontrak lebih dulu memaksa keputusan diambil
    saat masih murah: menamai field, memilih status code, memutuskan mana yang
    404 dan mana yang 403. Semuanya gratis sekarang, dan semuanya mahal setelah
    ada klien yang bergantung padanya.

    ## Cakupan berkas ini

    Lengkap untuk fondasi dan untuk **seluruh** Fase 3: `health`, `auth`,
    `organization`, `profiles`, `work-items`, `requests`.

    Sembilan belas modul sisanya **belum ada di sini**, dan itu bukan kelalaian:
    kontrak yang menebak bentuk endpoint yang aturannya belum ditulis akan
    menjadi kontrak yang harus dilanggar nanti. Setiap fase menambahkan bagiannya
    sendiri ke berkas ini sebelum modulnya dibangun.

    | Fase | Modul yang ditambahkan ke berkas ini |
    |---|---|
    | 3 | `organization`, `profiles`, `work-items`, `requests` — ✅ lengkap |
    | 4 | `letters`, `finance`, `dues`, `content`, `creative`, `partners`, `inventory`, `logistics` |
    | 5 | `meetings`, `calendar`, `milestones`, `announcements`, `feedback`, `notifications`, `attachments` |
    | 6 | `audit`, `reports`, `recycle-bin`, `settings` |

    ## Tiga hal yang berlaku di seluruh berkas ini

    **Satu, keamanan adalah bawaannya.** `security` dipasang di tingkat akar,
    sehingga setiap operasi menuntut token kecuali yang menulis
    `security: []` secara eksplisit. Kebalikannya — menuntut setiap operasi
    memasang `security` sendiri — berarti satu operasi baru yang lupa
    memasangnya menjadi endpoint terbuka. Bentuk di berkas ini mencerminkan
    `APP_GUARD` + `@Public()` di kode, dan alasan keduanya sama: lupa berarti
    tertutup, bukan terbuka.

    **Dua, 404 dipakai untuk dua hal yang berbeda.** Resource yang tidak ada,
    dan resource yang tidak boleh dilihat oleh pemanggilnya (`PRD-REVAMP.md`
    §7.3). Keduanya sengaja tidak dibedakan: membedakannya membocorkan bahwa
    resource-nya ada. Konsekuensi yang harus disadari klien: **404 bukan berarti
    "salah alamat"** — ia juga berarti "bukan urusan Anda".

    **Tiga, `403` hanya untuk penolakan yang tidak menyangkut baris.** Peran
    yang tidak boleh membuka endpoint, atau penanda `mustChangePassword` yang
    menyala. Endpoint yang resource-scoped selalu menjawab `404`.

    ## Bahasa

    Nama field, nilai enum, dan nilai peran dalam kontrak ini **sama persis**
    dengan yang tersimpan di database (keputusan 47). Tidak ada lapisan
    penerjemahan di antaranya, dan itu disengaja: lapisan penerjemahan adalah
    satu tempat tambahan yang bisa lupa diperbarui. Label Indonesia
    ("Diajukan", "Kadiv") hanya ada di frontend, lewat dictionary.

servers:
  - url: /api/v1
    description: Relatif terhadap host — cara frontend memanggilnya lewat BFF.
  - url: https://samudra-karsa-work-space-api.vercel.app/api/v1
    description: |
      Contoh produksi. Domain sesungguhnya ada di `API_PUBLIC_URL` (keputusan
      38); ia dipakai untuk membentuk URI `type` pada setiap problem, sehingga
      pindah domain tidak menuntut apa pun ditulis ulang.

tags:
  - name: health
    description: Liveness dan readiness. Satu-satunya tag yang seluruh operasinya publik.
  - name: auth
    description: |
      Masuk, keluar, memperbarui token, dan mengganti password.

      Tiga dari enam rute publik sistem ada di sini — `google`, `login`, dan
      `refresh`. Dua lagi milik `health`, dan yang keenam `GET /docs`.
      Seluruh rute auth yang lain — `GET /auth/session`,
      `POST /auth/logout`, dan `POST /auth/change-password` — **tertutup**, dan
      dua di antaranya justru tetap boleh dipakai saat `mustChangePassword`
      menyala.
  - name: work-items
    description: Pekerjaan — membuat, mengubah, menugaskan, memindahkan status.
  - name: requests
    description: Permintaan lintas divisi dan transisi statusnya.
  - name: organization
    description: |
      Data acuan organisasi: periode, divisi, cluster, subunit.

      Seluruh rutenya dijaga `organization:read` (semua yang sudah masuk) atau
      `organization:write` (`owner`/`co_owner` saja). Tidak ada penyaringan per
      peran di dalamnya, jadi tidak ada bentuk jawaban yang bergantung pada
      siapa yang bertanya.

      **Tidak ada penguncian optimistis di sini.** Keempat tabel ini tidak punya
      kolom `version`, dan tidak ada satu pun operasi di bawah yang membaca
      `If-Match`. Yang menggantikannya adalah indeks unik untuk kode dan
      pemeriksaan rujukan sebelum menghapus.
  - name: profiles
    description: |
      Anggota: profil diri sendiri, direktori anggota, dan administrasi anggota
      oleh `owner`/`co_owner`.

      Dua bentuk jawaban yang **sengaja tidak disatukan** — `ProfileDirectory`
      untuk yang boleh dibaca siapa saja yang sudah masuk, dan `ProfileFull`
      untuk diri sendiri serta halaman admin. Menyatukannya dengan penyaring
      peran berarti satu cabang `if` yang terbalik mengirim seluruh email dan
      nomor telepon ke semua orang, tanpa error dan tanpa gejala.

      `passwordHash` dan `googleSub` tidak ada di kedua bentuk itu, dan tidak
      akan pernah ada.

security:
  - bearerAuth: []

# ═══════════════════════════════════════════════════════════════════════════
# Jalur
# ═══════════════════════════════════════════════════════════════════════════

paths:
  # ─────────────────────────────────────────────────────────────────────────
  # Health
  # ─────────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness
      description: |
        Menjawab selama prosesnya hidup. **Tidak menyentuh database sama
        sekali**, dan itu syaratnya, bukan kebetulan: liveness yang ikut gagal
        saat database mati tidak bisa membedakan "aplikasinya mati" dari
        "databasenya mati" — dan dua hal itu menuntut tindakan yang berbeda.

        Dipakai untuk memastikan fungsi serverless benar-benar menyala setelah
        deploy, dan untuk menjaga fungsi tetap hangat (polling notifikasi
        frontend 30 detik, `PRD-REVAMP.md` §7.19.2).
      security: []
      responses:
        '200':
          description: Prosesnya hidup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /health/ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: |
        Menjalankan `SELECT 1` ke database. `503` kalau tidak bisa.

        Dibedakan dari liveness karena jawabannya berbeda artinya: `503` di sini
        berarti aplikasinya sehat tetapi tidak bisa melayani apa pun — dan itu
        keadaan yang perlu diketahui, bukan yang perlu disembunyikan.
      security: []
      responses:
        '200':
          description: Database terjangkau.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Database tidak terjangkau.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  # ─────────────────────────────────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────────────────────────────────

  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Masuk dengan Google
      description: |
        Jalur utama. BFF menukar kode OAuth dengan **ID token** di sisinya, lalu
        meneruskan token itu apa adanya ke sini.

        **Yang diterima adalah ID token mentah, bukan klaim yang sudah diurai.**
        Versi awal `PRD-REVAMP.md` §7.8.3 menggambarkan BFF mengirim `email`,
        `email_verified`, dan `sub` sebagai JSON biasa — dan bentuk itu tidak
        bisa diverifikasi apa pun, sehingga
        `{"email": "<email owner>", "emailVerified": true, "sub": "apa saja"}`
        menghasilkan sesi owner tanpa satu kredensial pun. ID token adalah JWT
        yang ditandatangani Google, jadi klaimnya bisa diperiksa. Lihat
        `GoogleLoginRequest`.

        Backend **tidak pernah bicara ke Google**: tidak ada penukaran kode, dan
        tidak ada `GOOGLE_CLIENT_SECRET` di sisi ini.

        **Lima pemeriksaan tertutup** (`PRD-REVAMP.md` §7.8.2), semuanya wajib:

        1. `email_verified` harus `true` — dibaca dari token yang **sudah
           terverifikasi**, bukan dari isian pemanggil
        2. Email dinormalisasi di kedua sisi
        3. **Tidak ada pembuatan akun otomatis** — profil harus sudah ada
        4. Status selain `inactive` diterima; `inactive` **ditolak**
        5. `sub` disimpan; pencocokan berikutnya lewat `sub`, bukan `email`

        Nomor 3 adalah inti "tertutup". Nomor 5 menutup skenario langka tetapi
        nyata: email lama dipakai ulang orang lain, dan orang itu masuk ke akun
        anggota sebelumnya. `sub` yang tersimpan berbeda dari `sub` yang dikirim
        **ditolak**, bukan diperbarui.

        `invited` menjadi `active` pada login pertama yang berhasil.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleLoginRequest' }
      responses:
        '200':
          description: Berhasil masuk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: |
            Email tidak terdaftar, akunnya nonaktif, `sub`-nya tidak cocok, atau
            ID tokennya tidak sah.

            Pesannya **selalu sama** untuk semua sebab itu, dan sama juga dengan
            kegagalan di `/auth/login` (`PRD-REVAMP.md` §7.8.4). Pesan yang
            berbeda memberi tahu penyerang email mana yang terdaftar — dan itu
            membatalkan sifat tertutup sistem ini.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [auth]
      operationId: loginWithPassword
      summary: Masuk dengan password
      description: |
        Jalur cadangan, untuk anggota yang tidak bisa atau tidak mau memakai
        Google. Password diperiksa dengan **argon2id**, bukan bcrypt.

        Memanggil `canAuthenticate(email)` yang **sama persis** dengan yang
        dipanggil jalur Google (`PRD-BACKEND.md` §6.1). Dua jalur masuk berarti
        dua tempat aturan "tertutup" ditegakkan; satu fungsi berarti tidak ada
        yang bisa menyimpang.

        Kalau passwordnya adalah password sementara dari owner,
        `mustChangePassword` menyala di hasilnya — dan sejak saat itu backend
        menolak seluruh endpoint kecuali jalur ganti-password
        (`PRD-BACKEND.md` §6.5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLoginRequest' }
      responses:
        '200':
          description: Berhasil masuk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          description: |
            Kredensial tidak sah, email tidak terdaftar, atau akun nonaktif —
            satu pesan untuk ketiganya.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Memperbarui access token
      description: |
        Refresh token **dirotasi setiap dipakai**: yang lama langsung dicabut dan
        digantikan yang baru (`PRD-REVAMP.md` §7.8.7).

        Rotasi bukan kerapian. Refresh token yang tidak dirotasi berlaku sampai
        kedaluwarsa tanpa cara mengetahui bahwa ia sudah disalin orang lain —
        sedangkan dengan rotasi, pemakaian token lama adalah bukti bahwa ada dua
        pemegang, dan keluarga token itu bisa dicabut seluruhnya.

        Refresh token **tidak pernah** dikirim di badan permintaan: ia ada di
        cookie `httpOnly` bernama `sk_refresh` yang dipegang BFF (keputusan 31).
        BFF meneruskan cookie itu apa adanya sebagai header `Cookie`.

        Jalur lewat badan permintaan sengaja **tidak** disediakan. Ia akan
        menjadi rute kedua bagi token paling sensitif di sistem ini — dan rute
        kedua itu adalah rute yang isinya ikut tercatat di log permintaan.
      security: []
      responses:
        '200':
          description: Token baru.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Siapa yang sedang masuk
      description: |
        Mengembalikan aktor yang sedang masuk, dari tokennya.

        **Tidak publik**, dan tetap boleh dipakai saat `mustChangePassword`
        menyala — ia ada di `PENDING_PASSWORD_EXEMPT`. Tanpa pengecualian itu,
        frontend tidak bisa mengetahui bahwa yang perlu ditampilkan adalah layar
        ganti password: ia hanya akan menerima penolakan tanpa tahu sebabnya.
      responses:
        '200':
          description: Aktor yang sedang masuk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Actor' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Keluar
      description: |
        Mencabut refresh token yang sedang dipakai. Access token yang masih
        berlaku **tidak** bisa dicabut — ia mati sendiri dalam 15 menit.
        Itu batas yang diterima, bukan yang terlupa.
      responses:
        '204':
          description: Sesi dicabut.
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Mengganti password sendiri
      description: |
        Satu-satunya jalan keluar saat `mustChangePassword` menyala.

        Dua akibat yang wajib menyertainya (`PRD-REVAMP.md` §7.8.6):

        - Penanda `mustChangePassword` dimatikan
        - **Seluruh refresh token anggota itu dicabut.** Sesi lama tidak boleh
          bertahan setelah password berubah — kalau bertahan, mengganti password
          bukan tindakan pengamanan, melainkan tindakan yang tidak mengubah apa
          pun bagi orang yang sudah memegang sesinya.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password diganti, sesi lain dicabut.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '409':
          description: Password saat ini tidak cocok.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ─────────────────────────────────────────────────────────────────────────
  # Pekerjaan
  # ─────────────────────────────────────────────────────────────────────────

  /work-items:
    get:
      tags: [work-items]
      operationId: listWorkItems
      summary: Daftar pekerjaan
      description: |
        Paginasi **cursor-based** (`PRD-REVAMP.md` §7.6). Offset rusak saat ada
        data masuk: halaman bergeser, dan ada baris yang terlewat atau muncul
        dua kali.

        Policy `work-item:read` — seluruh peran boleh.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Include'
        - name: status
          in: query
          description: Beberapa nilai dipisah koma.
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkStatus' }
          style: form
          explode: false
        - name: type
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkItemType' }
          style: form
          explode: false
        - name: priority
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/PriorityLevel' }
          style: form
          explode: false
        - name: divisionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: picId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: dueBefore
          in: query
          required: false
          schema: { type: string, format: date }
        - name: q
          in: query
          description: Pencarian teks pada judul dan nomor.
          required: false
          schema: { type: string, maxLength: 120 }
        - name: includeArchived
          in: query
          description: |
            Menyertakan baris yang `archivedAt`-nya terisi. Baris yang
            `deletedAt`-nya terisi **tidak pernah** muncul di sini — ia ada di
            recycle bin (`PRD-REVAMP.md` §14.2).
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Halaman pertama, atau halaman berikutnya.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemPage' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [work-items]
      operationId: createWorkItem
      summary: Membuat pekerjaan
      description: |
        Nomor pekerjaan (`WI-YYYY-#####`) **dihasilkan backend** di dalam
        transaksi yang sama dengan INSERT-nya, lewat tabel penghitung dengan
        `SELECT ... FOR UPDATE` (`PRD-BACKEND.md` §8.2). Klien tidak pernah
        mengirimnya, dan tidak ada celah nomor: `nextval()` memberi celah setiap
        kali transaksi bergulung balik, sedangkan nomor pekerjaan adalah nomor
        dokumen yang orang rujuk.

        Status awalnya `draft`. Pekerjaan yang lahir dari sebuah permintaan
        **tidak** dibuat di sini — ia dibuat backend saat permintaannya diajukan
        (temuan #7).

        Policy `work-item:create` — seluruh peran boleh.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemCreate' }
      responses:
        '201':
          description: Dibuat.
          headers:
            Location:
              description: URL pekerjaan yang baru dibuat.
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-items/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'

    get:
      tags: [work-items]
      operationId: getWorkItem
      summary: Satu pekerjaan
      description: |
        Mengembalikan `availableTransitions` — daftar status yang **sah bagi
        aktor ini** pada pekerjaan ini (`PRD-BACKEND.md` §9.1).

        Ini bukan kenyamanan. Di `sksks`, aturan transisi hidup di satu komponen
        frontend dan `REQUEST_WORKFLOW` bahkan kode mati (temuan §5.2.2). Dengan
        bentuk ini frontend **tidak punya pilihan selain** memakai daftar dari
        backend, sehingga state machine tidak bisa lagi hanya ada di UI.
      responses:
        '200':
          description: Pekerjaan ditemukan dan boleh dilihat.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

    patch:
      tags: [work-items]
      operationId: updateWorkItem
      summary: Mengubah sebagian pekerjaan
      description: |
        Policy `work-item:update` (`canEditWorkItem`):

        | Peran | Boleh mengubah |
        |---|---|
        | `owner`, `co_owner` | semuanya |
        | `division_head`, `division_deputy` | pekerjaan divisinya |
        | `member` | pekerjaan yang ia buat, ia pimpin, atau ia kerjakan |

        Penolakan selalu **404**, bukan 403.

        Field wajib per status diperiksa di sini, bukan di endpoint transisi:
        `holdReason` saat `on_hold` (keputusan 48), `completionSummary` saat
        `done`, dan `blockerReason` + `assistanceNeeded` saat pekerjaan
        dilaporkan terhambat. Ketiganya juga dijaga `CHECK` di database, jadi
        jalur mana pun yang melewatkannya tetap ditolak.

        **Mengubah `status` lewat sini ditolak** — status dipindahkan lewat
        `/work-items/{id}/transitions`. Satu jalur untuk satu operasi bermakna,
        seperti aksi domain lain.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemPatch' }
      responses:
        '200':
          description: Diubah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [work-items]
      operationId: deleteWorkItem
      summary: Menghapus pekerjaan (soft)
      description: |
        Soft delete — mengisi `deletedAt`. Barisnya masuk recycle bin dan bisa
        dipulihkan; ia **hilang dari seluruh daftar** sampai dipulihkan.

        Policy `work-item:delete` (`canDeleteWorkItem`): `owner`, `co_owner`, dan
        pemimpin divisinya. **`member` tidak**, bahkan atas pekerjaannya sendiri —
        berbeda dari `PATCH`, dan perbedaan itu disengaja (§7.9).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Dihapus.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  /work-items/{id}/pic:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'

    patch:
      tags: [work-items]
      operationId: setWorkItemPic
      summary: Menetapkan penanggung jawab
      description: |
        Dipisahkan dari `PATCH /work-items/{id}` karena aturannya berbeda, dan
        karena inilah jalur "klaim pekerjaan tanpa PIC" (§9.3 M2).

        Policy `work-item:set-pic` (`canChangePic`):

        | Peran | Boleh |
        |---|---|
        | `owner`, `co_owner` | selalu |
        | `division_head`, `division_deputy` | pada divisinya |
        | `member` | hanya mengisi PIC pada `task` yang **belum punya PIC** |

        Mengosongkan PIC (`null`) hanya boleh oleh pemimpin divisi dan
        owner/co-owner — anggota boleh **mengisi**, tidak boleh **mengosongkan**.
        Mengosongkan berarti meninggalkan pekerjaan tanpa penanggung jawab, dan
        itu keputusan, bukan inisiatif.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPicRequest' }
      responses:
        '200':
          description: PIC ditetapkan.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-items/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'

    post:
      tags: [work-items]
      operationId: transitionWorkItem
      summary: Memindahkan status pekerjaan
      description: |
        Aksi domain punya endpoint sendiri, bukan menumpang `PATCH`
        (`PRD-REVAMP.md` §7.3). Alasannya bukan kerapian: memindahkan status
        adalah operasi bermakna dengan aturan sendiri, dan aturan itu tidak boleh
        bercampur dengan aturan mengubah judul.

        **Konflik sinkronisasi menutup transisi bagi semua peran, termasuk
        `owner`** (keputusan 49). Penanda `syncConflictAt` berarti pekerjaan ini
        dan permintaan asalnya tidak lagi sepakat; memindahkan status salah
        satunya berarti memilih satu sisi secara diam-diam. Yang menutup konflik
        adalah **penyelesaiannya**, bukan wewenang yang lebih tinggi.

        Selain itu, wewenangnya mengikuti `PATCH` — `canEditWorkItem`.

        Transisi yang sah saja yang diterima; yang tidak sah dijawab `409`,
        bukan `422`, karena permintaannya benar tetapi keadaannya tidak
        memungkinkan. Daftar yang sah untuk aktor tertentu ada di
        `availableTransitions` pada `GET`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemTransitionRequest' }
      responses:
        '200':
          description: Status berpindah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/TransitionRejected'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ─────────────────────────────────────────────────────────────────────────
  # Permintaan
  # ─────────────────────────────────────────────────────────────────────────

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Daftar permintaan
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Include'
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/RequestStatus' }
          style: form
          explode: false
        - name: type
          in: query
          required: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/RequestType' }
          style: form
          explode: false
        - name: targetDivisionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: requesterId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Halaman pertama, atau halaman berikutnya.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestPage' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [requests]
      operationId: createRequest
      summary: Membuat permintaan
      description: |
        Nomor `REQ-YYYY-#####` dihasilkan backend, sama seperti nomor pekerjaan.

        Status awalnya `draft`. **Pekerjaan terhubung belum dibuat di sini** —
        ia dibuat saat permintaannya diajukan, bukan saat disimpannya sebagai
        draft (temuan #7). Membuatnya lebih awal berarti setiap draft yang tidak
        pernah diajukan meninggalkan pekerjaan yang tidak dikerjakan siapa pun.

        `extraFields` adalah kolom per jenis permintaan: nomor rekening untuk
        RAB, ukuran untuk desain. Empat belas jenis punya kebutuhan berbeda, dan
        empat belas tabel akan jauh lebih mahal daripada satu kolom `jsonb` yang
        divalidasi skema per jenis.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCreate' }
      responses:
        '201':
          description: Dibuat.
          headers:
            Location:
              schema: { type: string }
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /requests/{id}:
    parameters:
      - $ref: '#/components/parameters/RequestId'

    get:
      tags: [requests]
      operationId: getRequest
      summary: Satu permintaan
      responses:
        '200':
          description: Permintaan ditemukan dan boleh dilihat.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

    patch:
      tags: [requests]
      operationId: updateRequest
      summary: Mengubah sebagian permintaan
      description: |
        Mengubah `status` lewat sini **ditolak** — pakai
        `/requests/{id}/transitions`.

        Perubahan yang menyentuh `targetDivisionId` atau nilai anggaran
        menyalakan penanda sinkronisasi kalau pekerjaan terhubungnya sudah ada,
        karena keduanya mengubah dasar keputusan divisi tujuan.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPatch' }
      responses:
        '200':
          description: Diubah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [requests]
      operationId: deleteRequest
      summary: Menghapus permintaan (soft)
      description: |
        Soft delete — mengisi `deletedAt`. Barisnya masuk recycle bin dan bisa
        dipulihkan; ia **hilang dari seluruh daftar** sampai dipulihkan.

        `deleted_at`, bukan `DELETE FROM`: laporan yang menyebutnya akan berubah
        angkanya tanpa penjelasan.

        **Pekerjaan yang terhubung dibiarkan hidup**, dan itu disengaja. Ia
        dokumen tersendiri dengan pekerjaannya sendiri, dan `sourceRequestId`-nya
        tetap menunjuk baris permintaan yang masih ada — soft delete tidak
        menghapus barisnya, jadi riwayat pekerjaannya tetap bisa ditelusuri.
        Menghapusnya juga berarti pekerjaan yang sudah berjalan berhenti karena
        dokumen asalnya dirapikan, dan itu bukan hubungan yang diminta siapa pun.

        Policy `request:delete` (`canDeleteRequest`): `owner`, `co_owner`, dan
        pemimpin divisi terkait. **`member` tidak**, bahkan atas permintaannya
        sendiri — berbeda dari `PATCH`, dan perbedaan itu disengaja (§7.9):
        menghapus satu-satunya operasi yang tidak bisa diperiksa ulang orang lain
        setelah kejadiannya.

        `If-Match` wajib: menghapus berdasarkan versi yang sudah basi berarti
        menghapus baris yang sudah berubah sejak dibaca.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Dihapus.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  /requests/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/RequestId'

    post:
      tags: [requests]
      operationId: transitionRequest
      summary: Memindahkan status permintaan
      description: |
        Policy `request:transition` (`canTransitionRequest`):

        | Peran | Boleh |
        |---|---|
        | `owner`, `co_owner` | semua transisi |
        | `division_head`, `division_deputy` | permintaan yang **divisi tujuannya** ia pimpin |
        | `member` | hanya `draft → submitted`, dan hanya atas permintaannya sendiri |

        Baris terakhir **mengetatkan** `PRD-REVAMP.md` §7.9, yang menulis "hanya
        `draft→submitted`" tanpa menyebut siapa pemilik draftnya. Draft yang bisa
        diajukan orang lain adalah cara mengirim permintaan atas nama orang lain
        tanpa ia tahu. `INVENTARIS-ATURAN.md` §15 memang meminta §7.9
        **diketatkan**, bukan disalin dari matriks §10 yang melonggarkan hampir
        semuanya.

        **`need_clarification` tidak pernah dipetakan ke `need_review`**
        (temuan #5). Keduanya berbeda: `need_review` berarti pekerjaannya sudah
        jadi dan menunggu dinilai, `need_clarification` berarti belum bisa
        dimulai karena ada yang harus dijelaskan pemohon lebih dulu. Transisi ke
        `need_clarification` mewajibkan `clarificationNote`; ke `on_hold`
        mewajibkan `holdReason`; ke `done` mewajibkan `resultSummary`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestTransitionRequest' }
      responses:
        '200':
          description: Status berpindah.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/TransitionRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  /requests/{id}/sync-conflict:
    parameters:
      - $ref: '#/components/parameters/RequestId'

    post:
      tags: [requests]
      operationId: resolveSyncConflict
      summary: Menyelesaikan konflik sinkronisasi
      description: |
        Menutup konflik yang ditandai `syncConflictAt` (keputusan 49).

        Selama penanda itu terisi, **transisi status ditolak bagi semua peran**,
        termasuk `owner` — dan itulah gunanya. Pekerjaan dan permintaan asalnya
        tidak lagi sepakat, sehingga memindahkan status di atas ketidaksepakatan
        itu berarti memutuskan berdasarkan keadaan yang belum pernah dilihat
        siapa pun. Rute ini satu-satunya jalan keluar.

        `status` yang dikirim adalah keadaan yang **diputuskan berlaku**.
        `note` wajib: konflik yang selesai tanpa catatan alasan akan terulang
        tanpa ada yang tahu mengapa ia pernah ada.

        Medan yang dituntut status tujuan — `clarificationNote` untuk
        `need_clarification`, `holdReason` untuk `on_hold`, `resultSummary`
        untuk `done` — hanya perlu dikirim kalau barisnya belum memilikinya.
        Yang diperiksa service adalah **hasil akhirnya**, bukan ada tidaknya
        medan di sini.

        `If-Match` tetap wajib meski statusnya sedang tidak menentu — justru
        karena keputusan ini menimpa keadaan yang belum sepakat: menyelesaikannya
        di atas baris yang sudah bergerak lagi berarti memutuskan untuk keadaan
        yang belum pernah dilihat siapa pun.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveSyncConflictRequest' }
      responses:
        '200':
          description: Konflik diselesaikan.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Request' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/TransitionRejected'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/IfMatchRequired'

  # ─────────────────────────────────────────────────────────────────────────
  # Organisasi — data acuan
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Keempat tabel di bawah ini dibaca hampir setiap layar dan hanya ditulis
  # owner/co_owner. Tidak satu pun memakai If-Match: keempatnya tidak punya
  # kolom version, dan tidak ada layar yang membiarkan dua orang menyunting satu
  # baris acuan pada saat yang sama. Yang menggantikannya adalah indeks unik
  # untuk code dan pemeriksaan rujukan sebelum menghapus — keduanya ditegakkan
  # database, bukan disiplin.

  /organization/periods:
    get:
      tags: [organization]
      operationId: listPeriods
      summary: Daftar periode
      description: |
        Seluruh periode, yang paling baru dimulai lebih dulu.

        **Tanpa paginasi, tanpa `limit`, tanpa `sort`** — dan itu disengaja.
        Jumlah periode dalam satu masa kepengurusan adalah satuan, bukan
        ratusan; memasang cursor di sini akan menambah satu bentuk jawaban yang
        tidak pernah dipakai siapa pun.
      responses:
        '200':
          description: Daftar periode.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Period' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'

    post:
      tags: [organization]
      operationId: createPeriod
      summary: Membuat periode
      description: |
        Policy `organization:write` — hanya `owner` dan `co_owner`.

        `code` dinormalisasi menjadi **huruf besar** sebelum disimpan, jadi
        `kkn-2026-2027` dan `KKN-2026-2027` adalah periode yang sama dan yang
        kedua ditolak `409`.

        `startsOn` harus sebelum `endsOn`. Urutan terbalik ditolak `422`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodCreate' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Period' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateCode'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /organization/periods/active:
    get:
      tags: [organization]
      operationId: getActivePeriod
      summary: Periode yang sedang berlaku
      description: |
        Mengembalikan `null` — **bukan `404`** — kalau belum ada yang aktif.

        "Belum ada periode aktif" adalah keadaan yang sah pada sistem yang baru
        dipasang. `404` akan membuat frontend memperlakukannya sebagai kesalahan,
        lalu menampilkan pesan gagal untuk keadaan yang normal.

        Hanya satu periode yang boleh aktif sekaligus, dan itu dijaga **partial
        unique index** di database, bukan pemeriksaan di aplikasi: dua periode
        aktif sekaligus berarti dua periode yang sama-sama mengaku berlaku.
      responses:
        '200':
          description: Periode aktif, atau `null` kalau belum ada.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Period'
                  - type: 'null'
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /organization/periods/{id}:
    parameters:
      - $ref: '#/components/parameters/PeriodId'

    patch:
      tags: [organization]
      operationId: updatePeriod
      summary: Mengubah periode
      description: Sebagian — medan yang tidak dikirim tidak diubah.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodPatch' }
      responses:
        '200':
          description: Diubah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Period' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/DuplicateCode'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [organization]
      operationId: deletePeriod
      summary: Menghapus periode
      description: |
        **Ditolak `409` kalau masih ada yang merujuknya** — bukan menghapus paksa.

        `periods` dirujuk enam belas tabel, dan sebagian besar kuncinya
        `on delete set null`. Menghapus paksa akan **diam-diam mengosongkan**
        `period_id` setiap baris yang menunjuknya: tanpa error, dan tanpa cara
        mengetahui nilai sebelumnya.

        Itu penerapan §5.2.9 di luar jalur keuangan — gagal berisik lebih baik
        daripada berhasil diam-diam dengan akibat yang tidak diminta.
      responses:
        '204':
          description: Dihapus.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/StillReferenced'

  /organization/periods/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/PeriodId'

    post:
      tags: [organization]
      operationId: activatePeriod
      summary: Menjadikan periode ini yang berlaku
      description: |
        **`POST`, bukan `PATCH`.** Yang dikirim bukan sebagian isi periode,
        melainkan **perintah**: jadikan yang ini aktif.

        Efeknya pun bukan pada baris itu saja — periode yang tadinya aktif ikut
        dimatikan. `PATCH { "isActive": true }` akan menyiratkan bahwa yang
        berubah hanya satu baris, dan menyembunyikan separuh kejadiannya.

        Tanpa `Idempotency-Key`: memanggilnya dua kali menghasilkan keadaan yang
        sama persis, jadi tidak ada yang perlu dilindungi dari pengiriman ulang.
      responses:
        '200':
          description: Periode diaktifkan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Period' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'

  /organization/divisions:
    get:
      tags: [organization]
      operationId: listDivisions
      summary: Daftar divisi
      description: |
        Diurutkan `sortOrder`, lalu `name` sebagai pemecah seri.

        `sortOrder` sengaja **tidak unik**: dua divisi boleh memakai angka yang
        sama, dan `name` yang menentukan urutannya. Memaksanya unik akan memaksa
        setiap penyisipan ulang menomori ulang seluruh daftar — dan itu satu
        penulisan yang menyentuh puluhan baris untuk menambah satu divisi.
      responses:
        '200':
          description: Daftar divisi.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Division' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'

    post:
      tags: [organization]
      operationId: createDivision
      summary: Membuat divisi
      description: |
        Policy `organization:write` — hanya `owner` dan `co_owner`.

        **`code` dinormalisasi menjadi huruf kecil**, dan itu bukan kerapian.
        `divisions.code` dibandingkan **secara harfiah** oleh aturan izin:
        `resource.ts` memegang `FINANCE_DIVISION_CODE = 'sekbend'`, dan
        `leadsDivisionOf()` menilai dengan `actor.divisionCodes.includes(...)`
        tanpa normalisasi di mana pun.

        Divisi berkode `SEKBEND` karena itu akan **mencabut akses keuangan
        seluruh kepalanya** — tanpa error, tanpa catatan, dan tanpa gejala yang
        menunjuk ke sebabnya. Yang terlihat dari luar hanya "kepala Sekretaris &
        Bendahara tidak bisa membuka halaman keuangan".

        Indeks unik di database tidak menolong: ia case-sensitive, jadi
        `sekbend` dan `SEKBEND` sama-sama boleh ada dan menjadi dua divisi yang
        berbeda.

        Masukan huruf besar **diubah, bukan ditolak** — menolaknya akan membuat
        pengisi formulir pertama mengetik `SEKBEND`, mendapat error yang tidak
        menjelaskan akibatnya, lalu mengetik ulang hal yang sama.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DivisionCreate' }
      responses:
        '201':
          description: Dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Division' }
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateCode'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /organization/divisions/{id}:
    parameters:
      - $ref: '#/components/parameters/DivisionId'

    patch:
      tags: [organization]
      operationId: updateDivision
      summary: Mengubah divisi
