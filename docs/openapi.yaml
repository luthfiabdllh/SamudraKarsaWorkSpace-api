        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/DuplicateCode'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [organization]
      operationId: deleteDivision
      summary: Menghapus divisi
      description: |
        Ditolak `409` kalau masih dirujuk. `divisions` dirujuk delapan tabel dan
        sebagian besar kuncinya `on delete set null` — alasannya lengkap di
        `deletePeriod`.
      responses:
        '204':
          description: Dihapus.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrHidden'
        '409':
          $ref: '#/components/responses/StillReferenced'

